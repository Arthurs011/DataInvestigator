[project]
name = "data-investigator"
version = "0.1.0"
description = "Autonomous agent that investigates messy datasets and produces evidence-backed findings."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "networkx>=3.3",
    "duckdb>=1.0",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "PyYAML>=6.0",
    "Markdown>=3.6",
    "causal-learn>=0.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
investigator = "investigator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: fast unit tests with no external data",
    "integration: tests that need the downloaded Olist data",
    "slow: long-running pipeline test",
]